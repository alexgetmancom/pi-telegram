services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3
    user: "1000:1000"
    restart: unless-stopped
    env_file: /home/alex/.config/telegram-bot-api/secrets.env
    entrypoint: ["/usr/local/bin/telegram-bot-api"]
    command:
      - --local
      - --dir=/home/alex/.local/share/telegram-bot-api/data
      - --temp-dir=/home/alex/.local/share/telegram-bot-api/temp
      - --http-port=8081
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - /home/alex/.local/share/telegram-bot-api:/home/alex/.local/share/telegram-bot-api
      - /home/alex/.local/share/botflix/attachments:/home/alex/.local/share/botflix/attachments:ro
      - /home/alex/.pi/agent/tmp/pi-telegram/attachments:/home/alex/.pi/agent/tmp/pi-telegram/attachments:ro
